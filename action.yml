name: "Podcast generator"
author: "md"
description: "testing a podcast generator action"
runs:
  using: "docker"
  image: "Dockerfile"
branding:
  icon: "git-branch"
  color: "red"
inputs:
  email: 
    description: The commiters email address
    required: true
    default: ${{ github.actor }}@localhost
  name:
    description: the commiters name
    required: true
    default: ${{ github.actor }}
  